name: Chinese documentation freshness

on:
  push:
    branches: [codex/zh-docs]
  pull_request:
    branches: [codex/zh-docs]
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * *'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: '24'
      - name: Fetch current English source branch
        run: git fetch origin master --depth=1
      - name: Verify the checker can reject stale translations
        run: node --test tools/check-zh-docs.test.cjs
      - name: Check Chinese documents against English master
        run: node tools/check-zh-docs.cjs --source-ref origin/master
      - name: Check documentation links
        run: node tools/check-doc-links.js docs
